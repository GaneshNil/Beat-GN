name: Build Android APK

on:
  push:
    branches: [ "main", "master", "codex/marv-neo-v006213-audit" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK Licenses
      run: yes | sdkmanager --licenses || true

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Unit tests and lint
      run: ./gradlew test lint --stacktrace

    - name: Build debug and instrumentation APKs
      run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

    - name: Enable Android emulator acceleration
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Test app launch and Room migration on Android 16
      uses: reactivecircus/android-emulator-runner@v2.38.0
      with:
        api-level: 36
        target: google_apis
        arch: x86_64
        script: ./gradlew connectedDebugAndroidTest --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Beat-GN-debug-apk
        path: app/build/outputs/apk/debug/*.apk

